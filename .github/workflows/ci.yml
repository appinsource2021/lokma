name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lokma
          POSTGRES_PASSWORD: lokma
          POSTGRES_DB: lokma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lokma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lokma:lokma@localhost:5432/lokma
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lokma/api db:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @lokma/web build
